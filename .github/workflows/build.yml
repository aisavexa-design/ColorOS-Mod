name: Build and Sign APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool wget

      - name: Download Original APK
        run: |
          echo "Downloading original APK..."
          wget -O original_launcher.apk https://github.com/aisavexa-design/ColorOS-Mod/releases/download/v1.0/System.Launcher_17.3.12.apk

      - name: Decompile without Resources (-r)
        run: |
          echo "Decompiling without resources to bypass AAPT2 error..."
          apktool d -r -f original_launcher.apk -o safe_build_folder
          
      - name: Inject Edited Manifest
        run: |
          echo "Copying your edited AndroidManifest.xml..."
          cp decompiled_source/AndroidManifest.xml safe_build_folder/AndroidManifest.xml

      - name: Build APK
        run: |
          echo "Building safe APK..."
          apktool b safe_build_folder -o ColorOS_Launcher_Mod.apk

      - name: Download Uber APK Signer
        run: |
          echo "Downloading signing tool..."
          wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Sign APK
        run: |
          echo "Signing the APK..."
          java -jar uber-apk-signer-1.3.0.jar -a ColorOS_Launcher_Mod.apk --allowResign

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Modded_Launcher_APK
          path: ColorOS_Launcher_Mod-aligned-debugSigned.apk
