name: Build and Sign APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download Latest Apktool
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -O apktool.jar
          java -jar apktool.jar --version

      - name: Build APK (aapt2)
        run: |
          echo "Building APK..."
          java -jar apktool.jar b decompiled_source --use-aapt2 -o ColorOS_Launcher_Mod.apk
          ls -lh ColorOS_Launcher_Mod.apk

      - name: Download Uber APK Signer
        run: |
          wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Sign APK
        run: |
          echo "Signing the APK..."
          java -jar uber-apk-signer-1.3.0.jar -a ColorOS_Launcher_Mod.apk --allowResign
          ls -lh

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Modded_Launcher_APK
          path: ColorOS_Launcher_Mod-aligned-debugSigned.apk
          if-no-files-found: error
