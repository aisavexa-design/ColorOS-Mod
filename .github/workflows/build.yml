name: Build and Sign APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool wget

      - name: Remove Problematic Native Libs
        run: |
          echo "Removing conflicting native libs to prevent compile errors..."
          rm -rf decompiled_source/lib/

      - name: Build APK (Legacy Mode)
        run: |
          echo "Building APK..."
          apktool b decompiled_source -o ColorOS_Launcher_Mod.apk

      - name: Download Uber APK Signer
        run: |
          wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Sign APK
        run: |
          echo "Signing the APK..."
          java -jar uber-apk-signer-1.3.0.jar -a ColorOS_Launcher_Mod.apk --allowResign

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Modded_Launcher_APK
          path: ColorOS_Launcher_Mod-aligned-debugSigned.apk
