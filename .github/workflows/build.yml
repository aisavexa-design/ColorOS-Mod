name: Build and Sign APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download Latest Apktool
        run: |
          wget -O apktool.jar https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.10.0.jar

      - name: Fix Dollar ($) Resource Names
        run: |
          echo "Fixing invalid $ filenames in res folder..."
          cd decompiled_source/res
          
          # 1. Jin files ke naam mein '$' hai, unko '_' se rename karna
          find . -depth -name '*$*' | while IFS= read -r file; do
            dir=$(dirname "$file")
            base=$(basename "$file")
            newbase=$(echo "$base" | tr '$' '_')
            mv "$file" "$dir/$newbase"
          done
          
          # 2. Sabhi XML files ke andar jahan '$drawable_name' likha hai, wahan bhi '_' karna
          find . -type f -name "*.xml" -exec sed -i 's/\$/_/g' {} +

      - name: Build APK
        run: |
          echo "Building APK with Latest Apktool..."
          java -jar apktool.jar b --use-aapt2 decompiled_source -o ColorOS_Launcher_Mod.apk

      - name: Download Uber APK Signer
        run: |
          wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Sign APK
        run: |
          echo "Signing the APK..."
          java -jar uber-apk-signer-1.3.0.jar -a ColorOS_Launcher_Mod.apk --allowResign

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Modded_Launcher_APK
          path: ColorOS_Launcher_Mod-aligned-debugSigned.apk
