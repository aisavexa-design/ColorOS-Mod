name: Decompile APK from URL

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'APK ka download link yahan dalein'
        required: true

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool wget

      - name: Download APK
        run: |
          wget -O launcher.apk "${{ github.event.inputs.apk_url }}"
          
      - name: Decompile APK
        run: |
          apktool d -f launcher.apk -o decompiled_source
          
      - name: Commit and Push Decompiled Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add decompiled_source/
          if git diff-index --quiet HEAD; then
            echo "No changes"
          else
            git commit -m "Auto-decompiled APK from URL"
            git push
          fi
